name: R Web Scraper Schedule

on:
  schedule:
    # Runs everyday at 11:00 AM UTC or 6:00 AM EST (Adjust cron notation as needed)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows you to manually trigger the scraper from the UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # Required permissions to commit changes back to the repository
    permissions:
      contents: write

    steps:
      # Step 1: Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up R environment using the official r-lib action
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # Step 3: Install system dependencies required by R packages
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      # Step 4: Install necessary R packages
      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('dplyr', 'furrr', 'future', 'future.apply', 'openxlsx', 'polite', 'rvest', 'sf', 'sp', 'stringr'), dependencies=TRUE)"

      # Step 5: Execute the scraping script
      - name: Run R scraper script
        run: Rscript DailyRainCheck.R

      # Step 6: Commit and push the generated data back to the repo
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Totals/Rainfall_Data_*.xlsx
          git add Google_Earth/Emergency_Stations_*.kml
          git add Alert_Texts/Rainfall_Alert_*.txt
          
          # Only commit and push if the file actually changed to avoid empty workflow failures
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update scraped data: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          else
            echo "No changes to commit"
          fi
