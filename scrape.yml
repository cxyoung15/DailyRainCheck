name: Run R Web Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger button in GitHub Actions tab

jobs:
  autoscrape:
    runs-on: windows-latest
    
    # Required permissions to commit changes back to the repository
    permissions:
      contents: write

    steps:
      # Step 1: Check out the repository files
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up R environment using official r-lib actions
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Step 3: Install all packages listed in the DESCRIPTION file
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      # Step 4: Run the R web scraping script
      - name: Run scraper
        run: Rscript DRC_Test.R

      # Step 5: Commit and push the updated CSV back to the repo
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*
          git diff --staged --quiet || (git commit -m "Auto-update data: $(date)" && git push)
